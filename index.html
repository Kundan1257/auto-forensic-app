<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Forensic Platform</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

                <link rel="manifest" href="/manifest.json?v=4.5.1" />




  
  </head>
  <body class="bg-[#050608]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
        <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('🚀 Service Worker Registration Active:', reg.scope))
            .catch(err => console.warn('Service Worker registration bypassed:', err));
        });
      }
    </script>

  </body>
</html>
